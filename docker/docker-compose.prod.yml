# One NOAgenda instance: frontend + backend -> MariaDB. It publishes no ports: the shared Caddy
# (docker-compose.edge.yml) reaches it over the `noagenda-edge` network by the aliases <INSTANCE>-backend / -frontend.
# The database stays on this instance's private network.
#
#   docker compose -p noagenda-edge -f docker/docker-compose.edge.yml up -d                  # once per host
#   cp docker/.env.production.example docker/.env.production   # then edit
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.production up -d --build
#
# On a small server do not build there: CI publishes the images, and docker/deploy.sh pulls them.
name: noagenda

# Container logs rotate (3 x 10 MB per service). Without this, Docker keeps them forever and
# they eventually fill the disk.
# Least privilege for the stateless containers: no new privileges, no Linux capabilities, a
# read-only root filesystem (writable places are volumes or tmpfs) and a process cap.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp"]
  pids_limit: 256

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mariadb:
    logging: *default-logging
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      # Upgrades the data directory on the first start of a newer image. TAKE A BACKUP BEFORE
      # changing the image tag: a data directory cannot be downgraded (see "Backups and restore" in DEPLOYMENT.md).
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-noagenda}
      MARIADB_USER: ${MYSQL_USER:-noagenda}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    # Small-server tuning: a modest buffer pool and no performance_schema (saves ~100 MB).
    # Raise MARIADB_BUFFER_POOL on a bigger machine.
    command:
      - --innodb-buffer-pool-size=${MARIADB_BUFFER_POOL:-256M}
      - --performance-schema=OFF
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  backend:
    <<: *hardened
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    logging: *default-logging
    # `image` + `build`: a server pulls the prebuilt image (docker/deploy.sh); `up --build` still builds it locally.
    image: ${IMAGE_REPO:-ghcr.io/sinyaweo/noagenda}-backend:${IMAGE_TAG:-latest}
    build:
      context: ../app/backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mariadb
      DB_USERNAME: ${MYSQL_USER:-noagenda}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-noagenda}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>= 32 chars)}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
      # Number of proxies in front of the backend: 1 = Caddy only; 2 = Apache -> Caddy.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PUBLIC_URL: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
      # The browser sees the API under /api, so the refresh cookie is scoped to /api/auth.
      REFRESH_COOKIE_PATH: /api/auth
      # Email (password reset + address verification). Without SMTP_HOST mail is only logged.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
      REQUIRE_TERMS_ACCEPTANCE: ${REQUIRE_TERMS_ACCEPTANCE:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      ACCOUNT_DELETION_GRACE_DAYS: ${ACCOUNT_DELETION_GRACE_DAYS:-}
      # Public demo instance only: lists the example users on the login page and blocks password/email/deletion changes.
      DEMO_MODE: ${DEMO_MODE:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      internal:
      edge:
        aliases: ["${INSTANCE:?INSTANCE is required (a short name unique on this host, e.g. app or demo)}-backend"]

  frontend:
    <<: *hardened
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    logging: *default-logging
    image: ${IMAGE_REPO:-ghcr.io/sinyaweo/noagenda}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../app/frontend
      args:
        VITE_API_BASE: /api
        VITE_OPERATOR_NAME: ${OPERATOR_NAME:-}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      # adapter-node uses ORIGIN to validate form posts (CSRF) behind the proxy.
      ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
    networks:
      internal:
      edge:
        aliases: ["${INSTANCE:?INSTANCE is required (a short name unique on this host, e.g. app or demo)}-frontend"]

volumes:
  mariadb_data:
  uploads:

networks:
  internal:
  # Shared with the one reverse proxy (docker-compose.edge.yml), which creates it.
  edge:
    name: noagenda-edge
    external: true
