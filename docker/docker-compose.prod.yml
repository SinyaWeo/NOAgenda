# Production stack: Caddy (TLS) -> frontend + backend -> MariaDB.
# Only Caddy publishes ports; the database and apps are on the internal network.
#
#   cp docker/.env.production.example docker/.env.production   # then edit
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.production up -d --build
name: noagenda

# Container logs rotate (3 x 10 MB per service). Without this, Docker keeps them forever and
# they eventually fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mariadb:
    logging: *default-logging
    image: mariadb:11.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-noagenda}
      MARIADB_USER: ${MYSQL_USER:-noagenda}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  backend:
    logging: *default-logging
    build:
      context: ../app/backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mariadb
      DB_USERNAME: ${MYSQL_USER:-noagenda}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-noagenda}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>= 32 chars)}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
      TRUST_PROXY: 1
      PUBLIC_URL: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
      # The browser sees the API under /api, so the refresh cookie is scoped to /api/auth.
      REFRESH_COOKIE_PATH: /api/auth
      # Email (password reset + address verification). Without SMTP_HOST mail is only logged.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
      REQUIRE_TERMS_ACCEPTANCE: ${REQUIRE_TERMS_ACCEPTANCE:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      ACCOUNT_DELETION_GRACE_DAYS: ${ACCOUNT_DELETION_GRACE_DAYS:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [internal]

  frontend:
    logging: *default-logging
    build:
      context: ../app/frontend
      args:
        VITE_API_BASE: /api
        VITE_OPERATOR_NAME: ${OPERATOR_NAME:-}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      # adapter-node uses ORIGIN to validate form posts (CSRF) behind the proxy.
      ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
    networks: [internal]

  caddy:
    logging: *default-logging
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks: [internal]

volumes:
  mariadb_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
