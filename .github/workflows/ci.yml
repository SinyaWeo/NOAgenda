name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx jest
      # Fails on critical advisories only: a known high-severity multer DoS needs a
      # major NestJS upgrade. Tighten to `high` once that is done.
      - run: npm audit --omit=dev --audit-level=critical

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_API_BASE: /api
      - run: npm audit --omit=dev --audit-level=high

  # Starts the real API against MariaDB and runs the authorization regression
  # script (users must not reach each other's data; role escalation is blocked).
  authz:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.3
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: noagenda_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      DB_DATABASE: noagenda_ci
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: app/backend
      - name: Start API
        working-directory: app/backend
        run: |
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && exit 0; sleep 2; done
          cat api.log; exit 1
      - name: Authorization smoke test
        working-directory: app/backend
        run: BASE_URL=http://127.0.0.1:3000 python3 scripts/authz-smoke.py
      - if: failure()
        run: cat app/backend/api.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t noagenda-backend app/backend
          docker build --build-arg VITE_API_BASE=/api -t noagenda-frontend app/frontend
      - name: Validate production compose file
        run: |
          DOMAIN=example.com MYSQL_ROOT_PASSWORD=x MYSQL_PASSWORD=y JWT_SECRET=z \
            docker compose -f docker/docker-compose.prod.yml config -q
