name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npx jest
      # No high/critical advisories remain. (Three moderate ones sit inside TypeORM's own
      # glob/minimatch dependencies and are not reachable: the glob patterns are constants.)
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE: /api
      - run: npm audit --omit=dev --audit-level=high

  # Starts the real API against MariaDB and runs the authorization regression
  # script (users must not reach each other's data; role escalation is blocked).
  authz:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: noagenda_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      DB_DATABASE: noagenda_ci
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000
      LOGIN_RATE_LIMIT: 100
      ACCOUNT_PURGE_INTERVAL_SECONDS: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: app/backend
      - name: Start API
        working-directory: app/backend
        run: |
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && exit 0; sleep 2; done
          cat api.log; exit 1
      - name: Authorization smoke test
        working-directory: app/backend
        run: BASE_URL=http://127.0.0.1:3000 python3 scripts/authz-smoke.py
      - name: Validation, export and account-deletion test
        working-directory: app/backend
        run: |
          SQL_CMD="mysql --protocol=TCP -h127.0.0.1 -uroot -pci-root-password noagenda_ci -N" \
          UPLOADS_ON_THIS_HOST=1 BASE_URL=http://127.0.0.1:3000 python3 scripts/validation-account-smoke.py
      - if: failure()
        run: cat app/backend/api.log

  # Default-deny routes, API-token scopes, search-only user lookup, upload checks and quota, webhook
  # SSRF guard, per-address login lockout and join-table uniqueness. Needs its own API process: it
  # registers users (10 per hour per process) and wants TRUST_PROXY=1 + a 1 MB upload quota.
  # The production path: an EMPTY database brought up by the migrations alone (NODE_ENV=production turns
  # schema sync off), then checked against the entities. Any difference means an entity changed without a
  # migration, which would break a real deployment even though the other jobs (sync on) pass.
  migrations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: noagenda_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      DB_DATABASE: noagenda_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: app/backend
      # NODE_ENV=production is set per step, not per job: at job level `npm ci` would skip the
      # devDependencies and `nest build` would not be found.
      - name: Run migrations on an empty database
        working-directory: app/backend
        env:
          NODE_ENV: production
        run: npm run migration:run:prod
      - name: Schema must match the entities
        working-directory: app/backend
        env:
          NODE_ENV: production
        run: |
          out=$(npx typeorm schema:log -d dist/data-source.js 2>&1)
          echo "$out"
          echo "$out" | grep -q "Your schema is up to date" || { echo "::error::entities and migrations have drifted: generate a migration"; exit 1; }

  hardening:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: noagenda_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      DB_DATABASE: noagenda_ci
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000
      LOGIN_RATE_LIMIT: 100
      TRUST_PROXY: 1
      USER_STORAGE_QUOTA_MB: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: app/backend
      - name: Start API
        working-directory: app/backend
        run: |
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && exit 0; sleep 2; done
          cat api.log; exit 1
      - name: Hardening smoke test
        working-directory: app/backend
        run: BASE_URL=http://127.0.0.1:3000 python3 scripts/hardening-smoke.py
      - if: failure()
        run: cat app/backend/api.log

  # Email verification, sessions, refresh rotation/theft detection, lockout, password
  # reset and API tokens, with real SMTP delivery into a Mailpit sink.
  auth-lifecycle:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: noagenda_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mailpit:
        image: axllent/mailpit:v1.33
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      DB_DATABASE: noagenda_ci
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      LOGIN_RATE_LIMIT: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: app/backend
      - name: Start API
        working-directory: app/backend
        run: |
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && exit 0; sleep 2; done
          cat api.log; exit 1
      - name: Auth lifecycle test
        working-directory: app/backend
        run: BASE_URL=http://127.0.0.1:3000 MAILPIT_URL=http://127.0.0.1:8025 python3 scripts/auth-lifecycle-smoke.py
      - if: failure()
        run: cat app/backend/api.log

  # Real browser (Chromium) against the production Docker stack: Caddy over HTTPS, the real
  # CSP and Secure cookie, email to a mail sink. See e2e/README.md.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser smoke test
        run: e2e/run.sh
      - name: Keep screenshots and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build images
        run: |
          docker build -t noagenda-backend app/backend
          docker build --build-arg VITE_API_BASE=/api -t noagenda-frontend app/frontend
      - name: Validate production compose file
        run: |
          DOMAIN=example.com MYSQL_ROOT_PASSWORD=x MYSQL_PASSWORD=y JWT_SECRET=z \
            docker compose -f docker/docker-compose.prod.yml config -q
